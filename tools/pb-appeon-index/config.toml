# Appeon documentation releases supported by pb-ai-code.
#
# This is a packaged catalog, not a user configuration file. `pb-ai-code
# search setup` detects installed PowerBuilder products and selects their
# matching slugs. `pb-appeon-index update --version <slug>` is the lower-level
# command used for a specific known release.

