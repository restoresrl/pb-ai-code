name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # windows-latest, and not only for parity with pb-orca-mcp: the install
    # writes Windows paths and a `.claude/` layout, and the link check runs
    # against what lands - the check that has caught something every time it
    # has been run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        # hatch-vcs derives the version from `git describe`. checkout
        # defaults to depth 1, which has no tags: the build then produces
        # `0.1.dev1+g<sha>` and says so only in a UserWarning, so CI would
        # ship mis-versioned wheels without going red.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # No PowerBuilder and no ORCA are involved: the two local tools are
        # pure Python, and the skills are Markdown. Nothing here is skipped
        # for want of a PB install.
        run: pytest -ra

  lint:
    name: Lint (ruff, mypy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        # hatch-vcs derives the version from `git describe`. checkout
        # defaults to depth 1, which has no tags: the build then produces
        # `0.1.dev1+g<sha>` and says so only in a UserWarning, so CI would
        # ship mis-versioned wheels without going red.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Kept as its own step because it is the one that gets forgotten: it had
      # been failing in the sibling repository for three tagged releases while
      # `ruff check` passed, and nobody looked.
      - name: Format check
        # Path-scoped on purpose: `ruff format --check .` fails today on
        # skills/appeon-query/SKILL.md and skills/pb-review/SKILL.md,
        # because ruff formats Python inside Markdown fences.
        run: ruff format --check tools tests

      - name: Types
        # Not `mypy tools`: that fails with `Duplicate module named "tests"`.
        run: mypy tools/pb-source-analyzer/src tools/pb-appeon-index/src tools/pb-ai-code/src
