name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # windows-latest, and not only for parity with pb-orca-mcp: the link tests
    # run scripts/install-skills.ps1 for real and check what lands, which is
    # the check that has caught something every time it has been run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # No PowerBuilder and no ORCA are involved: the two local tools are
        # pure Python, and the skills are Markdown. Nothing here is skipped
        # for want of a PB install.
        run: pytest -ra

  lint:
    name: Lint (ruff, mypy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Kept as its own step because it is the one that gets forgotten: it had
      # been failing in the sibling repository for three tagged releases while
      # `ruff check` passed, and nobody looked.
      - name: Format check
        run: ruff format --check tools tests

      - name: Types
        run: mypy tools/pb-source-analyzer/src tools/pb-appeon-index/src
