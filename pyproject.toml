[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "pb-ai-code"
dynamic = ["version"]
description = "Agentic dev kit for PowerBuilder: skills, knowledge base and orchestration on top of pb-orca-mcp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Carlo Torrese", email = "carlo.torrese@re-store.it" },
]
keywords = ["powerbuilder", "agentic", "agent-skills", "mcp", "pb", "ai", "coding"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # Ceiling because `mcp` 2.0.0 removed `mcp.server.fastmcp`, which
    # pb_appeon_index.mcp_server is built on. Without it, the `uv pip install
    # -e ".[dev]"` in docs/install.md produces an Appeon index server that
    # cannot start. Same break, same fix, as pb-orca-mcp v0.2.2. Lift the
    # ceiling together with a port to the 2.x server API.
    "mcp>=1.0,<2",
    # config.py reads TOML; tomllib landed in 3.11, so 3.10 needs the backport.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
pb-source-analyzer = "pb_source_analyzer.__main__:main"
pb-appeon-index = "pb_appeon_index.__main__:main"
pb-ai-code = "pb_ai_code.__main__:main"

[project.urls]
Homepage = "https://github.com/restoresrl/pb-ai-code"
Issues = "https://github.com/restoresrl/pb-ai-code/issues"

[tool.hatch.version]
# The tag is the version. `pyproject.toml` used to carry a literal, and it sat
# three minors behind `git tag` without anything noticing; the marker file this
# repository's installer writes now quotes the number, so a stale literal would
# be the number every consumer reads. A build one commit past a tag says so out
# loud (`0.5.1.dev1+g<sha>`). CI must check out with `fetch-depth: 0` - a
# shallow, tagless clone silently produces `0.1.dev1+g<sha>` and only a
# UserWarning.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
    "tools/pb-source-analyzer/src/pb_source_analyzer",
    "tools/pb-appeon-index/src/pb_appeon_index",
    "tools/pb-ai-code/src/pb_ai_code",
]

# The kit itself travels in the wheel, under the package that installs it, so
# `uvx --from git+https://github.com/restoresrl/pb-ai-code pb-ai-code install`
# has something to install. force-include is the only mechanism that reaches
# such a build - the sdist `include` above does not affect the wheel.
#
# Map these seven paths and NEVER the docs/ root. force-include ignores
# .gitignore AND ignores `exclude` (both verified): mapping "docs" pulls
# docs/appeon-index/index.db into the wheel from any developer machine that has
# built it, and that database is never redistributed. Whole directories rather
# than file lists, because the installer discovers its inputs by glob - a new
# skill must ship with no build change.
[tool.hatch.build.targets.wheel.force-include]
"skills"                = "pb_ai_code/_kit/skills"
"commands"              = "pb_ai_code/_kit/commands"
"harness"               = "pb_ai_code/_kit/harness"
"docs/pb-antipatterns"  = "pb_ai_code/_kit/docs/pb-antipatterns"
"docs/pb-source-format" = "pb_ai_code/_kit/docs/pb-source-format"
"docs/wiki-notes.md"    = "pb_ai_code/_kit/docs/wiki-notes.md"
"docs/plan-file-contract.md" = "pb_ai_code/_kit/docs/plan-file-contract.md"
# Not kit payload: pb-appeon-index needs its own config.toml at runtime, and
# without it `uvx --from git+... pb-appeon-index update` dies on a path that
# only exists in a checkout - which is why building an index used to require
# `git clone`.
"tools/pb-appeon-index/config.toml" = "pb_appeon_index/config.toml"

[tool.hatch.build.targets.sdist]
include = [
    "tools/pb-source-analyzer",
    "tools/pb-appeon-index",
    "tools/pb-ai-code",
    "tests",
    "docs",
    "skills",
    "commands",
    "harness",
    "scripts",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "LICENSE",
    "PLAN.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "tools/pb-source-analyzer/tests",
    "tools/pb-appeon-index/tests",
    "tools/pb-ai-code/tests",
]
# --import-mode=importlib: both tools ship a tests/ package, and under the
# default "prepend" mode the second one to be collected shadows the first
# (same package name), so a plain `pytest` fails in collection.
addopts = "-ra --strict-markers --import-mode=importlib"
# `--strict-markers` is on, so a marker must be declared before it is used.
# `slow` is for the two tests that build a wheel and populate a throwaway
# environment: tens of seconds each, and the only tests that prove the
# packaged payload — the thing that makes `uvx --from git+...` work at all.
markers = [
    "slow: builds a wheel or a virtual environment (tens of seconds)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "tools/pb-source-analyzer/src",
    "tools/pb-appeon-index/src",
    "tools/pb-ai-code/src",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "tools/pb-source-analyzer/src:tools/pb-appeon-index/src:tools/pb-ai-code/src"
